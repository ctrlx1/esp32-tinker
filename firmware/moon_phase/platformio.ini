[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 9600

lib_deps =
  symlink://../../packages/tinker-core
  symlink://../../packages/tinker-display-max7219

extra_scripts =
  pre:../../scripts/pio/configure_firmware.py

custom_tinker_project_id = moon_phase

[env:esp32dev]

[env:wokwi]
build_flags =
  -D WOKWI_SIM=1
