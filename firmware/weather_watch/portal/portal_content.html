  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Weather Watch Setup</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 1rem;
        display: grid;
        place-items: center;
        background: #101820;
        color: #eef6fb;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(100%, 380px);
        padding: 1.25rem;
        border: 1px solid #334955;
        border-radius: 14px;
        background: #17242c;
      }
      h1 { margin: 0; font-size: 1.35rem; }
      .sub, .hint { color: #a5b7c0; font-size: 0.82rem; }
      .status { margin: 0.5rem 0 1rem; color: #74b9ff; }
      section {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid #334955;
      }
      label { display: block; margin: 0.7rem 0 0.3rem; font-weight: 600; }
      input, button {
        width: 100%;
        min-height: 42px;
        border: 1px solid #45606d;
        border-radius: 8px;
        padding: 0.65rem;
        background: #101820;
        color: #eef6fb;
      }
      button {
        margin-top: 0.8rem;
        cursor: pointer;
        border-color: #4f9fc4;
        background: #74c0e3;
        color: #101820;
        font-weight: 700;
      }
      button.secondary, .network {
        background: #22343e;
        border-color: #45606d;
        color: #eef6fb;
      }
      .network { text-align: left; margin-top: 0.4rem; }
      .message { min-height: 1.2rem; margin-top: 0.7rem; font-size: 0.88rem; }
      .error { color: #ff7675; }
      .success { color: #55efc4; }
      progress { width: 100%; margin-top: 0.7rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Weather Watch</h1>
      <div class="sub">Version APP_VERSION_PLACEHOLDER</div>
      <div class="status">Connected &mdash; IP_PLACEHOLDER</div>

      <section>
        <strong>Wi-Fi</strong>
        <button class="secondary" type="button" onclick="scanNetworks()">
          Scan for networks
        </button>
        <div id="networks"></div>
        <label for="ssid">Network name</label>
        <input id="ssid" value="SSID_PLACEHOLDER" placeholder="Keep saved network" />
        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="Keep saved password" />
      </section>

      <section>
        <strong>Display</strong>
        <label for="brightness">Brightness (0&ndash;15)</label>
        <input id="brightness" type="number" min="0" max="15" step="1"
               required value="BRIGHTNESS_PLACEHOLDER" />
        <button type="button" onclick="saveSettings()">Save &amp; restart</button>
        <div id="save-message" class="message"></div>
      </section>

      <section>
        <strong>Firmware update</strong>
        <div class="hint">Expected file: APP_FIRMWARE_FILENAME_PLACEHOLDER</div>
        <input id="firmware" type="file" accept=".bin" />
        <button class="secondary" type="button" onclick="uploadFirmware()">
          Upload firmware
        </button>
        <progress id="progress" value="0" max="100" hidden></progress>
        <div id="ota-message" class="message"></div>
      </section>
    </main>

    <script>
      function setMessage(id, text, isError) {
        const element = document.getElementById(id);
        element.textContent = text;
        element.className = "message " + (isError ? "error" : "success");
      }

      async function scanNetworks() {
        const container = document.getElementById("networks");
        container.textContent = "Scanning...";
        try {
          const response = await fetch("/scan");
          const networks = await response.json();
          container.replaceChildren();
          networks.forEach(function (network) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "network";
            button.textContent =
              network.ssid + " (" + network.rssi + " dBm)" +
              (network.secure ? " \uD83D\uDD12" : "");
            button.onclick = function () {
              document.getElementById("ssid").value = network.ssid;
            };
            container.appendChild(button);
          });
          if (!networks.length) container.textContent = "No networks found.";
        } catch (error) {
          container.textContent = "Network scan failed.";
        }
      }

      async function saveSettings() {
        const brightness = document.getElementById("brightness");
        if (!brightness.checkValidity()) {
          setMessage("save-message", "Brightness must be 0 through 15.", true);
          return;
        }
        const params = new URLSearchParams({
          ssid: document.getElementById("ssid").value,
          pass: document.getElementById("pass").value,
          brightness: brightness.value
        });
        try {
          const response = await fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
          });
          const text = await response.text();
          setMessage("save-message", text, !response.ok);
        } catch (error) {
          setMessage("save-message", "Save failed.", true);
        }
      }

      function uploadFirmware() {
        const file = document.getElementById("firmware").files[0];
        if (!file) {
          setMessage("ota-message", "Choose a .bin file first.", true);
          return;
        }
        const progress = document.getElementById("progress");
        const request = new XMLHttpRequest();
        request.open("POST", "/update");
        request.upload.onprogress = function (event) {
          if (event.lengthComputable) {
            progress.hidden = false;
            progress.value = Math.round(event.loaded * 100 / event.total);
          }
        };
        request.onload = function () {
          setMessage(
            "ota-message",
            request.status === 200 ? "Upload complete. Restarting..." : request.responseText,
            request.status !== 200
          );
        };
        request.onerror = function () {
          setMessage("ota-message", "Upload failed.", true);
        };
        const data = new FormData();
        data.append("firmware", file, file.name);
        request.send(data);
      }
    </script>
  </body>
