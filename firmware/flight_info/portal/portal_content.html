  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flight Info Setup</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 1rem;
        display: grid;
        place-items: center;
        background: #101010;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(100%, 380px);
        padding: 1.25rem;
        border: 1px solid #303030;
        border-radius: 14px;
        background: #1a1a1a;
      }
      h1 { margin: 0; font-size: 1.35rem; }
      .sub, .hint { color: #999; font-size: 0.82rem; }
      .status { margin: 0.5rem 0 1rem; color: #74b9ff; }
      section {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid #303030;
      }
      label { display: block; margin: 0.7rem 0 0.3rem; font-weight: 600; }
      input, select, button {
        width: 100%;
        min-height: 42px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 0.65rem;
        background: #121212;
        color: #eee;
      }
      button {
        margin-top: 0.8rem;
        cursor: pointer;
        border-color: #d35400;
        background: #e67e22;
        color: #111;
        font-weight: 700;
      }
      button.secondary {
        background: #242424;
        border-color: #444;
        color: #ddd;
      }
      .network {
        text-align: left;
        margin-top: 0.4rem;
        background: #242424;
        border-color: #444;
        color: #eee;
      }
      .row { display: flex; gap: 0.6rem; }
      .row > * { flex: 1; }
      a.maps {
        display: inline-block;
        margin-top: 0.55rem;
        color: #74b9ff;
        font-size: 0.88rem;
      }
      .message { min-height: 1.2rem; margin-top: 0.7rem; font-size: 0.88rem; }
      .error { color: #ff7675; }
      .success { color: #55efc4; }
      progress { width: 100%; margin-top: 0.7rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Flight Info</h1>
      <div class="sub">Version APP_VERSION_PLACEHOLDER</div>
      <div class="status">Connected &mdash; IP_PLACEHOLDER</div>

      <section>
        <strong>Wi-Fi</strong>
        <button class="secondary" type="button" onclick="scanNetworks()">
          Scan for networks
        </button>
        <div id="networks"></div>
        <label for="ssid">Network name</label>
        <input id="ssid" value="SSID_PLACEHOLDER" placeholder="Keep saved network" />
        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="Keep saved password" />
      </section>

      <section>
        <strong>Aircraft search</strong>
        <label for="lat">Latitude</label>
        <input id="lat" type="number" min="-90" max="90" step="any"
               value="LAT_PLACEHOLDER" />
        <label for="lon">Longitude</label>
        <input id="lon" type="number" min="-180" max="180" step="any"
               value="LON_PLACEHOLDER" />
        <div class="row">
          <button class="secondary" type="button" onclick="pasteGps()">
            Paste GPS
          </button>
        </div>
        <a id="maps-link" class="maps" href="https://www.google.com/maps" target="_blank"
           rel="noopener noreferrer">Open in Google Maps</a>
        <div class="hint">
          Right-click the map and copy coordinates, then use Paste GPS.
        </div>
        <label for="radius">Radius</label>
        <input id="radius" type="number" min="0.000001" step="any"
               value="RADIUS_PLACEHOLDER" />
        <label for="radiusUnit">Radius unit</label>
        <select id="radiusUnit">
          <option value="0">Miles</option>
          <option value="1">Kilometres</option>
        </select>
        <label for="speedUnit">Speed unit</label>
        <select id="speedUnit">
          <option value="0">Knots</option>
          <option value="1">Miles/hour</option>
          <option value="2">Kilometres/hour</option>
        </select>
        <label for="distUnit">Distance to Aircraft</label>
        <select id="distUnit">
          <option value="0">Miles</option>
          <option value="1">Kilometres</option>
        </select>
        <label for="brightness">Brightness (0&ndash;15)</label>
        <input id="brightness" type="number" min="0" max="15"
               value="BRIGHTNESS_PLACEHOLDER" />
        <label for="cardDwell">Card dwell (seconds)</label>
        <input id="cardDwell" type="number" min="2" max="30"
               value="DWELL_PLACEHOLDER" />
        <button type="button" onclick="saveSettings()">Save &amp; restart</button>
        <div id="save-message" class="message"></div>
      </section>

      <section>
        <strong>Firmware update</strong>
        <div class="hint">
          Expected file: APP_FIRMWARE_FILENAME_PLACEHOLDER
        </div>
        <input id="firmware" type="file" accept=".bin" />
        <button class="secondary" type="button" onclick="uploadFirmware()">
          Upload firmware
        </button>
        <progress id="progress" value="0" max="100" hidden></progress>
        <div id="ota-message" class="message"></div>
      </section>
    </main>

    <script>
      document.getElementById("radiusUnit").value = "RADIUS_UNIT_PLACEHOLDER";
      document.getElementById("speedUnit").value = "SPEED_UNIT_PLACEHOLDER";
      document.getElementById("distUnit").value = "DIST_UNIT_PLACEHOLDER";

      function setMessage(id, text, isError) {
        const element = document.getElementById(id);
        element.textContent = text;
        element.className = "message " + (isError ? "error" : "success");
      }

      function updateMapsLink() {
        const lat = document.getElementById("lat").value;
        const lon = document.getElementById("lon").value;
        document.getElementById("maps-link").href =
          "https://www.google.com/maps?q=" +
          encodeURIComponent(lat + "," + lon);
      }

      function parseGps(text) {
        const match = String(text).trim().match(
          /^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/
        );
        if (!match) {
          return null;
        }
        const lat = parseFloat(match[1]);
        const lon = parseFloat(match[2]);
        if (!isFinite(lat) || !isFinite(lon) || lat < -90 || lat > 90 ||
            lon < -180 || lon > 180) {
          return null;
        }
        return { lat: lat, lon: lon };
      }

      async function pasteGps() {
        let text = "";
        try {
          text = await navigator.clipboard.readText();
        } catch (_) {
          text = window.prompt("Paste latitude, longitude") || "";
        }
        const parsed = parseGps(text);
        if (!parsed) {
          setMessage("save-message", "Could not parse lat, lon from the clipboard.", true);
          return;
        }
        document.getElementById("lat").value = parsed.lat;
        document.getElementById("lon").value = parsed.lon;
        updateMapsLink();
        setMessage("save-message", "Pasted " + parsed.lat + ", " + parsed.lon, false);
      }

      document.getElementById("lat").addEventListener("input", updateMapsLink);
      document.getElementById("lon").addEventListener("input", updateMapsLink);
      updateMapsLink();

      async function scanNetworks() {
        const container = document.getElementById("networks");
        container.textContent = "Scanning...";
        try {
          const response = await fetch("/scan");
          const networks = await response.json();
          container.replaceChildren();
          networks.forEach(function (network) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "network";
            button.textContent =
              network.ssid + " (" + network.rssi + " dBm)" +
              (network.secure ? " \uD83D\uDD12" : "");
            button.onclick = function () {
              document.getElementById("ssid").value = network.ssid;
            };
            container.appendChild(button);
          });
          if (!networks.length) container.textContent = "No networks found.";
        } catch (error) {
          container.textContent = "Network scan failed.";
        }
      }

      async function saveSettings() {
        const params = new URLSearchParams({
          ssid: document.getElementById("ssid").value,
          pass: document.getElementById("pass").value,
          lat: document.getElementById("lat").value,
          lon: document.getElementById("lon").value,
          radius: document.getElementById("radius").value,
          radiusUnit: document.getElementById("radiusUnit").value,
          speedUnit: document.getElementById("speedUnit").value,
          distUnit: document.getElementById("distUnit").value,
          brightness: document.getElementById("brightness").value,
          cardDwell: document.getElementById("cardDwell").value
        });
        try {
          const response = await fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
          });
          const text = await response.text();
          setMessage("save-message", text, !response.ok);
        } catch (error) {
          setMessage("save-message", "Save failed.", true);
        }
      }

      function uploadFirmware() {
        const file = document.getElementById("firmware").files[0];
        if (!file) {
          setMessage("ota-message", "Choose a .bin file first.", true);
          return;
        }
        const progress = document.getElementById("progress");
        const request = new XMLHttpRequest();
        request.open("POST", "/update");
        request.upload.onprogress = function (event) {
          if (event.lengthComputable) {
            progress.hidden = false;
            progress.value = Math.round(event.loaded * 100 / event.total);
          }
        };
        request.onload = function () {
          setMessage(
            "ota-message",
            request.status === 200 ? "Upload complete. Restarting..." : request.responseText,
            request.status !== 200
          );
        };
        request.onerror = function () {
          setMessage("ota-message", "Upload failed.", true);
        };
        const data = new FormData();
        data.append("firmware", file, file.name);
        request.send(data);
      }
    </script>
  </body>
