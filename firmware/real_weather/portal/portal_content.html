<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Real Weather Setup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 1rem; display: grid;
      place-items: center; background: #101820; color: #eef6fb;
      font-family: system-ui, sans-serif; }
    main { width: min(100%, 390px); padding: 1.25rem; border: 1px solid #304654;
      border-radius: 14px; background: #182630; }
    h1 { margin: 0; font-size: 1.4rem; }
    .sub, .hint { color: #a9bbc6; font-size: .84rem; }
    .status { margin: .5rem 0 1rem; color: #74b9ff; }
    section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #304654; }
    label { display: block; margin: .7rem 0 .3rem; font-weight: 600; }
    input, button { width: 100%; min-height: 42px; border: 1px solid #476170;
      border-radius: 8px; padding: .65rem; background: #101820; color: #eef6fb; }
    button { margin-top: .8rem; cursor: pointer; background: #55b7d5;
      border-color: #55b7d5; color: #071217; font-weight: 700; }
    button.secondary, .network { background: #243945; border-color: #476170;
      color: #eef6fb; text-align: left; }
    .message { min-height: 1.2rem; margin-top: .7rem; font-size: .88rem; }
    .error { color: #ff8f8f; } .success { color: #75e6b1; }
    progress { width: 100%; margin-top: .7rem; }
  </style>
</head>
<body>
  <main>
    <h1>Real Weather</h1>
    <div class="sub">Version APP_VERSION_PLACEHOLDER</div>
    <div class="status">Connected &mdash; IP_PLACEHOLDER</div>

    <section>
      <strong>Wi-Fi</strong>
      <button class="secondary" type="button" onclick="scanNetworks()">Scan for networks</button>
      <div id="networks"></div>
      <label for="ssid">Network name</label>
      <input id="ssid" value="SSID_PLACEHOLDER" placeholder="Keep saved network" />
      <label for="pass">Password</label>
      <input id="pass" type="password" placeholder="Keep saved password" />
    </section>

    <section>
      <strong>Weather display</strong>
      <label for="wxZip">US ZIP code</label>
      <input id="wxZip" maxlength="10" pattern="[0-9]{5}(-[0-9]{4})?"
             value="WX_ZIP_PLACEHOLDER" placeholder="12345" />
      <label for="speed">Scroll speed (ms)</label>
      <input id="speed" type="number" min="1" max="10000" step="1"
             value="SPEED_PLACEHOLDER" />
      <label for="brightness">Brightness (0&ndash;15)</label>
      <input id="brightness" type="number" min="0" max="15" step="1"
             value="BRIGHTNESS_PLACEHOLDER" />
      <button type="button" onclick="saveSettings()">Save &amp; restart</button>
      <div id="save-message" class="message"></div>
    </section>

    <section>
      <strong>Firmware update</strong>
      <div class="hint">Expected file: APP_FIRMWARE_FILENAME_PLACEHOLDER</div>
      <input id="firmware" type="file" accept=".bin" />
      <button class="secondary" type="button" onclick="uploadFirmware()">Upload firmware</button>
      <progress id="progress" value="0" max="100" hidden></progress>
      <div id="ota-message" class="message"></div>
    </section>
  </main>
  <script>
    function message(id, text, bad) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "message " + (bad ? "error" : "success");
    }
    async function scanNetworks() {
      const box = document.getElementById("networks");
      box.textContent = "Scanning...";
      try {
        const networks = await (await fetch("/scan")).json();
        box.replaceChildren();
        for (const network of networks) {
          const button = document.createElement("button");
          button.type = "button"; button.className = "network";
          button.textContent = network.ssid + " (" + network.rssi + " dBm)" +
            (network.secure ? " \uD83D\uDD12" : "");
          button.onclick = () => document.getElementById("ssid").value = network.ssid;
          box.appendChild(button);
        }
        if (!networks.length) box.textContent = "No networks found.";
      } catch (_) { box.textContent = "Network scan failed."; }
    }
    async function saveSettings() {
      const params = new URLSearchParams({
        ssid: document.getElementById("ssid").value,
        pass: document.getElementById("pass").value,
        wxZip: document.getElementById("wxZip").value,
        speed: document.getElementById("speed").value,
        brightness: document.getElementById("brightness").value
      });
      try {
        const response = await fetch("/save", { method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString() });
        message("save-message", await response.text(), !response.ok);
      } catch (_) { message("save-message", "Save failed.", true); }
    }
    function uploadFirmware() {
      const file = document.getElementById("firmware").files[0];
      if (!file) return message("ota-message", "Choose a .bin file first.", true);
      const progress = document.getElementById("progress");
      const request = new XMLHttpRequest();
      request.open("POST", "/update");
      request.upload.onprogress = event => {
        if (event.lengthComputable) {
          progress.hidden = false; progress.value = Math.round(event.loaded * 100 / event.total);
        }
      };
      request.onload = () => message("ota-message",
        request.status === 200 ? "Upload complete. Restarting..." : request.responseText,
        request.status !== 200);
      request.onerror = () => message("ota-message", "Upload failed.", true);
      const data = new FormData(); data.append("firmware", file, file.name); request.send(data);
    }
  </script>
</body>
